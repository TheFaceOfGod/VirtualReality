<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-sphere radius="1.5" position="0 1.5 -3" color="#FFFF00" phi-start="90" phi-length="300" rotation="330 0 90" side="double"></a-sphere>
      <a-sphere color="black" radius="0.2" position="-1 2.4 -2.5"></a-sphere>
      <a-sphere color="black" radius="0.2" position="1 2.4 -2.5"></a-sphere>
      <a-cylinder color="#FFFF00" radius="1.5" height="0" rotation="330 0 0" position="0 1.5 -3"></a-cylinder>
      <a-cylinder color="#FFFF00" radius="1.5" height="0" rotation="30 0 0" position="0 1.5 -3"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="blue"></a-sky>
    </a-scene>
  </body>
</html>
